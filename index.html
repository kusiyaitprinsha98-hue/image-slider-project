<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="slider" id="slider">
                
        <div class="slider-track">
            <div class="slide"><img src="images/image1.jpg" alt="slider 1"></div>
            <div class="slide"><img src="images/image2.jpg" alt="slider 2"></div>
            <div class="slide"><img src="images/image3.jpg" alt="slider 3"></div>
            <div class="slide"><img src="images/image4.jpg" alt="slider 4"></div>
        </div>

        <button class="slider-btn prev">&#10094;</button>
        <button class="slider-btn next">&#10095;</button>

        <div class="slider-dots"></div>
    </div>
    <script src="slider.js"></script>

</body>
</html>
